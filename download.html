<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>qPTM | Download</title>
  <script src="assets/js/include.js"></script>
</head>
<body>
  <div id="preloader">
  <div class="preloader-inner">
    <div class="preloader-spinner"></div>
    <span class="preloader-text">Loading...</span>
  </div>
</div>

<div id="site-header"></div>

<section id="main">


    <div class="page-hero">
      <h1>Download</h1>
    </div>

<div class="lp-panel">
      <div class="lp-panel-header"><i class="ri-download-2-line mr-2"></i>Download Dataset</div>
      <div class="lp-panel-body">
        <p class="text-des">The complete qPTM dataset is available for download. Please fill in the form below to request access. A download link will be sent to your email address.</p>

        <div id="downloadAlert" class="status-msg" style="display:none;margin-bottom:16px"></div>

        <form id="downloadForm">
          <div class="row mb-3">
            <div class="col-md-3">
              <span class="filter-label">Title <span style="color:#e74c3c">*</span></span>
              <select id="title" class="form-control" required>
                <option value="">-- Select Title --</option>
                <option value="Mr">Mr.</option>
                <option value="Ms">Ms.</option>
                <option value="Dr">Dr.</option>
                <option value="Prof">Prof.</option>
              </select>
            </div>
            <div class="col-md-4">
              <span class="filter-label">First Name <span style="color:#e74c3c">*</span></span>
              <input class="form-control" id="firstname" placeholder="First name" required>
            </div>
            <div class="col-md-5">
              <span class="filter-label">Last Name <span style="color:#e74c3c">*</span></span>
              <input class="form-control" id="lastname" placeholder="Last name" required>
            </div>
          </div>
          <div class="row mb-3">
            <div class="col-md-4">
              <span class="filter-label">Affiliation <span style="color:#e74c3c">*</span></span>
              <input class="form-control" id="affiliation" placeholder="Institution" required>
            </div>
            <div class="col-md-4">
              <span class="filter-label">Country <span style="color:#e74c3c">*</span></span>
              <input class="form-control" id="country" placeholder="Country" required>
            </div>
            <div class="col-md-4">
              <span class="filter-label">Email <span style="color:#e74c3c">*</span></span>
              <input class="form-control" type="email" id="email" placeholder="your@email.com" required>
            </div>
          </div>
          <div class="mb-3">
            <span class="filter-label">Verification</span>
            <div id="captcha" style="max-width:300px;border:1px solid var(--border);border-radius:var(--card-radius);padding:8px;text-align:center;background:#f8f9fa">
              <p class="text-muted mb-0" style="font-size:12px">Drag the slider to verify</p>
              <input type="range" id="msg" class="w-100 mt-2" min="0" max="100" value="0">
            </div>
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary" id="download_submit"><i class="ri-download-2-line"></i> Request Download</button>
            <button type="reset" class="btn"><i class="ri-eraser-line"></i> Clear</button>
          </div>
        </form>
      </div>
    </div>
  </section>

  <div id="site-footer"></div>

<a href="#" class="back-to-top"><i class="ri-arrow-up-line"></i></a>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jquery.easing@1.4.1/jquery.easing.min.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    var validated = false;
    var verifyToken = '';

    function showAlert(type, message) {
      var $alert = $('#downloadAlert');
      $alert.removeClass('status-error').toggleClass('status-error', type === 'error');
      $alert.html(type === 'error'
        ? '<i class="ri-error-warning-line"></i> ' + message
        : '<i class="ri-checkbox-circle-line"></i> ' + message);
      $alert.show();
    }

    $(document).ready(function(){
      $('#msg').on('input change', function() {
        if (parseInt(this.value, 10) >= 95) {
          validated = true;
          verifyToken = String(Date.now());
          this.value = 100;
        }
      });

      $('#downloadForm').on('reset', function() {
        validated = false;
        verifyToken = '';
        $('#msg').val(0);
        $('#downloadAlert').hide();
      });

      $('#downloadForm').on('submit', function(e) {
        e.preventDefault();
        if (!$('#title').val() || !$('#firstname').val() || !$('#lastname').val()
            || !$('#affiliation').val() || !$('#country').val() || !$('#email').val()) {
          showAlert('error', 'Please fill in all required fields.');
          return;
        }
        if (!validated || !verifyToken) {
          showAlert('error', 'Please complete the verification.');
          return;
        }

        var $btn = $('#download_submit');
        $btn.prop('disabled', true).html('<span class="spinner"></span> Sending...');

        $.ajax({
          url: './resource/download_request.php',
          method: 'POST',
          dataType: 'json',
          data: {
            title: $('#title').val(),
            firstname: $('#firstname').val(),
            lastname: $('#lastname').val(),
            affiliation: $('#affiliation').val(),
            country: $('#country').val(),
            email: $('#email').val(),
            msg: verifyToken
          }
        }).done(function(res) {
          if (res && res.success) {
            showAlert('success', res.message);
            $('#downloadForm')[0].reset();
            validated = false;
            verifyToken = '';
          } else {
            showAlert('error', (res && res.message) ? res.message : 'Request failed. Please try again.');
          }
        }).fail(function() {
          showAlert('error', 'Request failed. Please try again later.');
        }).always(function() {
          $btn.prop('disabled', false).html('<i class="ri-download-2-line"></i> Request Download');
        });
      });

      $(window).scroll(function(){
        if ($(this).scrollTop() > 300) $('.back-to-top').addClass('active');
        else $('.back-to-top').removeClass('active');
      });
      $('.back-to-top').on('click', function(e) {
        e.preventDefault();
        $('html,body').animate({scrollTop: 0}, 300);
      });
    });
  </script>
</body>
</html>
