description: >
  STRING aggregates experimental, computational and text-mined protein
  associations into scored functional / physical / regulatory networks.
  Agent uses the REST interaction_partners endpoint (cn.string-db.org mirror
  preferred; falls back if Cloudflare blocks string-db.org).

