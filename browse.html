<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>qPTM | Browse</title>
  <script src="assets/js/include.js"></script>
</head>
<body>
  <div id="preloader">
  <div class="preloader-inner">
    <div class="typing-dots typing-dots-lg" aria-hidden="true"><span></span><span></span><span></span></div>
    <span class="preloader-text">Loading...</span>
  </div>
</div>

<div id="site-header"></div>

<section id="main" class="browse-page">

    <div class="page-hero">
      <h1>Browse</h1>
    </div>

<div class="lp-panel">
      <div class="lp-panel-body">
        <div class="result-filters browse-filters">
          <div class="filter-row filter-row-main">
            <div class="filter-dropdowns" id="browseFilterDropdowns"></div>
          </div>
        </div>

        <div id="browseContent">
          <div id="firstWordFilter" class="mb-3"></div>
          <div id="optionList" class="mb-3"></div>
          <div id="optionNum"></div>
          <div id="optionPage" class="mt-2"></div>
        </div>
      </div>
    </div>
  </section>

  <div id="site-footer"></div>

<a href="#" class="back-to-top"><i class="ri-arrow-up-line"></i></a>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/mine.js"></script>
  <script>
    $(document).ready(function(){
      var firstWord = '';
      var state = {
        org: 'Human',
        mod: 'Phosphorylation',
        btype: 'condition'
      };

      var FILTERS = [
        {
          key: 'org',
          label: 'Organism',
          options: ['Human', 'Mouse', 'Rat', 'Yeast']
        },
        {
          key: 'mod',
          label: 'Modification',
          options: [
            'Phosphorylation', 'Acetylation', 'Ubiquitylation', 'Methylation',
            'Glycosylation', 'SUMOylation', 'Malonylation', 'Lactylation',
            'Succinylation', 'β-Hydroxybutyrylation', 'Palmitoylation', 'Crotonylation'
          ]
        },
        {
          key: 'btype',
          label: 'Browse by',
          options: [
            { value: 'condition', label: 'Condition' },
            { value: 'sample', label: 'Sample' }
          ]
        }
      ];

      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function optionMeta(opt) {
        if (opt && typeof opt === 'object') {
          return { value: opt.value, label: opt.label };
        }
        return { value: opt, label: opt };
      }

      function displayLabel(key, value) {
        var filter = FILTERS.find(function(f){ return f.key === key; });
        if (!filter) return value;
        for (var i = 0; i < filter.options.length; i++) {
          var meta = optionMeta(filter.options[i]);
          if (meta.value === value) return meta.label;
        }
        return value;
      }

      function buildFilters() {
        var html = '';
        FILTERS.forEach(function(filter) {
          html += '<div class="filter-div has-filter" data-key="' + filter.key + '">';
          html += '<span class="filter-label">' + filter.label + '</span>';
          html += '<div class="rf-select">';
          html += '<button type="button" class="rf-select-toggle" aria-haspopup="listbox">';
          html += '<span class="rf-select-label">' + escapeHtml(displayLabel(filter.key, state[filter.key])) + '</span>';
          html += '<i class="ri-arrow-down-s-line rf-select-arrow"></i>';
          html += '</button>';
          html += '<div class="rf-select-panel">';
          html += '<div class="rf-select-search"><input type="search" class="form-control form-control-sm" placeholder="Search..."></div>';
          html += '<div class="rf-select-options" role="listbox">';
          filter.options.forEach(function(opt) {
            var meta = optionMeta(opt);
            var checked = meta.value === state[filter.key] ? ' is-checked' : '';
            html += '<button type="button" class="rf-option' + checked + '" data-value="' + escapeHtml(meta.value) + '">';
            html += '<span class="rf-checkbox"><i class="ri-check-line"></i></span>';
            html += '<span class="rf-option-label">' + escapeHtml(meta.label) + '</span>';
            html += '</button>';
          });
          html += '</div>';
          html += '<div class="rf-select-actions">';
          html += '<button type="button" class="btn btn-sm btn-primary rf-apply-btn">Apply</button>';
          html += '<button type="button" class="btn btn-sm rf-clear-btn">Clear</button>';
          html += '</div></div></div></div>';
        });
        $('#browseFilterDropdowns').html(html);
      }

      function closeFilterPanels() {
        $('.browse-page .rf-select').removeClass('is-open');
      }

      function openFilterPanel($div) {
        closeFilterPanels();
        $div.find('.rf-select').addClass('is-open');
        $div.find('.rf-select-search input').val('').trigger('input').focus();
      }

      function syncFilterUI(key) {
        var $div = $('.browse-page .filter-div[data-key="' + key + '"]');
        $div.find('.rf-select-label').text(displayLabel(key, state[key]));
        $div.find('.rf-option').each(function() {
          $(this).toggleClass('is-checked', $(this).attr('data-value') === state[key]);
        });
        $div.addClass('has-filter');
      }

      function applyFilter($div) {
        var key = $div.attr('data-key');
        var $checked = $div.find('.rf-option.is-checked');
        if (!$checked.length) {
          return;
        }
        state[key] = $checked.attr('data-value');
        syncFilterUI(key);
        closeFilterPanels();
        firstWord = '';
        loadFirstWords();
      }

      function clearFilter($div) {
        var key = $div.attr('data-key');
        var defaults = { org: 'Human', mod: 'Phosphorylation', btype: 'condition' };
        state[key] = defaults[key];
        syncFilterUI(key);
        closeFilterPanels();
        firstWord = '';
        loadFirstWords();
      }

      function loadFirstWords(){
        $.post('./resource/functions.php', {
          type: 'browseFword',
          org: state.org,
          mod: state.mod,
          btype: state.btype,
          firstWord: ''
        }, function(data){
          var letters = data || [];
          var html = '<span class="filter-label">First Letter</span><div>';
          html += '<span class="filter-tag" data-letter="">All</span>';
          for (var i = 0; i < letters.length; i++) {
            var letter = letters[i];
            var label = letter === 'ZZ' ? '#' : letter;
            html += '<span class="filter-tag" data-letter="' + letter + '">' + label + '</span>';
          }
          html += '</div>';
          $('#firstWordFilter').html(html);
          $('#firstWordFilter .filter-tag').on('click', function(){
            $('#firstWordFilter .filter-tag').removeClass('selected');
            $(this).addClass('selected');
            firstWord = $(this).attr('data-letter') || '';
            loadOptions(1);
          });
          $('#firstWordFilter .filter-tag:first').addClass('selected');
          loadOptions(1);
        }, 'json');
      }

      function loadOptions(page){
        $.post('./resource/functions.php', {
          type: 'browseOption',
          org: state.org,
          mod: state.mod,
          btype: state.btype,
          firstWord: firstWord,
          nowPage: page,
          optionNumber: 50
        }, function(data){
          var type = state.btype;
          var html = '<span class="filter-label">' + type.charAt(0).toUpperCase() + type.slice(1) + 's (' + data.totalNum + ' total)</span>';
          html += '<div class="browse-tag-wrap">';
          for (var i = 0; i < data.nowList.length; i++) {
            var term = String(data.nowList[i]).trim();
            html += '<span class="filter-tag browse-term-tag" style="font-size:13px;padding:6px 12px;cursor:pointer" data-term="' + $('<div>').text(term).html() + '">' + $('<div>').text(term).html() + '</span>';
          }
          html += '</div>';
          $('#optionList').html(html);
          $('#optionNum').html('<span class="text-muted">Showing ' + data.nowList.length + ' of ' + data.totalNum + ' entries</span>');

          var totalPages = Math.ceil(data.totalNum / 50);
          if (totalPages > 1) {
            var phtml = '<ul class="pagination">';
            phtml += '<li class="page-item' + (page <= 1 ? ' disabled' : '') + '"><a class="page-link" href="javascript:void(0)" data-page="' + (page - 1) + '">&laquo;</a></li>';
            for (var p = 1; p <= totalPages; p++) {
              if (p === 1 || p === totalPages || Math.abs(p - page) <= 2) {
                phtml += '<li class="page-item' + (p === page ? ' active' : '') + '"><a class="page-link" href="javascript:void(0)" data-page="' + p + '">' + p + '</a></li>';
              } else if (Math.abs(p - page) === 3) {
                phtml += '<li class="page-item disabled"><a class="page-link">...</a></li>';
              }
            }
            phtml += '<li class="page-item' + (page >= totalPages ? ' disabled' : '') + '"><a class="page-link" href="javascript:void(0)" data-page="' + (page + 1) + '">&raquo;</a></li>';
            phtml += '</ul>';
            $('#optionPage').html(phtml);
          } else {
            $('#optionPage').html('');
          }
        }, 'json');
      }

      $(document).on('click', '.browse-page .rf-select-toggle', function(e) {
        e.stopPropagation();
        var $div = $(this).closest('.filter-div');
        if ($div.find('.rf-select').hasClass('is-open')) {
          closeFilterPanels();
        } else {
          openFilterPanel($div);
        }
      });

      $(document).on('click', '.browse-page .rf-option', function(e) {
        e.preventDefault();
        var $opt = $(this);
        $opt.closest('.rf-select-options').find('.rf-option').removeClass('is-checked');
        $opt.addClass('is-checked');
      });

      $(document).on('input', '.browse-page .rf-select-search input', function() {
        var keywords = $(this).val().toLowerCase();
        var $panel = $(this).closest('.rf-select-panel');
        $panel.find('.rf-option').each(function() {
          var text = $(this).find('.rf-option-label').text().toLowerCase();
          $(this).toggleClass('is-hidden', keywords !== '' && text.indexOf(keywords) === -1);
        });
      });

      $(document).on('click', '.browse-page .rf-apply-btn', function(e) {
        e.stopPropagation();
        applyFilter($(this).closest('.filter-div'));
      });

      $(document).on('click', '.browse-page .rf-clear-btn', function(e) {
        e.stopPropagation();
        clearFilter($(this).closest('.filter-div'));
      });

      $(document).on('click', function(e) {
        if (!$(e.target).closest('.browse-page .rf-select').length) {
          closeFilterPanels();
        }
      });

      $('#optionList').on('click', '.browse-term-tag', function() {
        var term = $(this).attr('data-term');
        window.location = 'result.html?type=search'
          + '&simple_search_tag0=' + encodeURIComponent(state.btype)
          + '&simple_search_input0=' + encodeURIComponent(term)
          + '&simple_search_mod=' + encodeURIComponent(state.mod)
          + '&simple_search_org=' + encodeURIComponent(state.org);
      });

      $('#optionPage').on('click', '.page-link', function() {
        var p = parseInt($(this).attr('data-page'), 10);
        if (p) loadOptions(p);
      });

      buildFilters();
      loadFirstWords();
    });
  </script>
</body>
</html>
