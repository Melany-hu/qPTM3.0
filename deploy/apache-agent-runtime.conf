# Apache proxy snippet: route chat/conversations/classify to TS runtime (8101),
# keep collection and export on Python (8100).

# Include inside the /agent-api proxy context:

# Chat + conversations → TypeScript agent-runtime
ProxyPassMatch ^/agent-api/(chat|conversations|classify|health)$ http://127.0.0.1:8101/$1
ProxyPassReverseMatch ^/agent-api/(chat|conversations|classify|health)$ http://127.0.0.1:8101/$1

ProxyPassMatch ^/agent-api/conversations/(.*)$ http://127.0.0.1:8101/conversations/$1
ProxyPassReverseMatch ^/agent-api/conversations/(.*)$ http://127.0.0.1:8101/conversations/$1

# Collection + export + session + tools → Python agent-backend
ProxyPass /agent-api/collection http://127.0.0.1:8100/collection
ProxyPassReverse /agent-api/collection http://127.0.0.1:8100/collection
ProxyPass /agent-api/export http://127.0.0.1:8100/export
ProxyPassReverse /agent-api/export http://127.0.0.1:8100/export
ProxyPass /agent-api/session http://127.0.0.1:8100/session
ProxyPassReverse /agent-api/session http://127.0.0.1:8100/session
ProxyPass /agent-api/tools http://127.0.0.1:8100/tools
ProxyPassReverse /agent-api/tools http://127.0.0.1:8100/tools
