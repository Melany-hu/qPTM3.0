<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>qPTM | Search results</title>
  <script src="assets/js/include.js"></script>
</head>
<body>
  <div id="preloader">
    <div class="preloader-inner">
      <div class="typing-dots typing-dots-lg" aria-hidden="true"><span></span><span></span><span></span></div>
      <span class="preloader-text">Loading...</span>
    </div>
  </div>

  <div id="site-header"></div>

  <section id="main" class="result-page">
    <div class="page-hero">
      <h1>Search results</h1>
    </div>

    <div class="lp-panel result-panel">
      <span id="rawQueryInfo" style="display:none"></span>
      <div class="lp-panel-body">
        <div id="querySummary" class="result-query-summary" style="display:none"></div>

        <div class="result-filters">
          <div class="filter-row filter-row-main">
            <div class="filter-dropdowns"></div>
            <div class="filter-row-actions">
              <span class="filter-label filter-label-spacer" aria-hidden="true">Sample</span>
              <button class="btn" id="download_button" type="button"><i class="ri-download-2-line"></i> Download</button>
            </div>
          </div>
        </div>

        <div class="result-table-wrap">
          <table class="lp-table result-table">
            <thead>
              <tr>
                <th class="col-detail"></th>
                <th class="th-sortable col-uniprot" data-sort="up">
                  <span class="th-label">UniProt ID</span>
                  <button type="button" class="th-sort-indicator" aria-label="Sort by UniProt ID" title="Sort"></button>
                </th>
                <th class="th-sortable col-gene" data-sort="gene">
                  <span class="th-label">Gene Name</span>
                  <button type="button" class="th-sort-indicator" aria-label="Sort by gene name" title="Sort"></button>
                </th>
                <th class="th-sortable col-pos" data-sort="pos">
                  <span class="th-label">Position</span>
                  <button type="button" class="th-sort-indicator" aria-label="Sort by position" title="Sort"></button>
                </th>
                <th class="th-sortable col-mod" data-sort="mods">
                  <span class="th-label">Modification</span>
                  <button type="button" class="th-sort-indicator" aria-label="Sort by modification" title="Sort"></button>
                </th>
                <th class="th-sortable col-pep" data-sort="pep">
                  <span class="th-label">Sequence Window</span>
                  <button type="button" class="th-sort-indicator" aria-label="Sort by sequence window" title="Sort"></button>
                </th>
                <th class="th-sortable col-sample" data-sort="sample">
                  <span class="th-label">Sample</span>
                  <button type="button" class="th-sort-indicator" aria-label="Sort by sample" title="Sort"></button>
                </th>
                <th class="th-sortable col-condition" data-sort="samplecondition">
                  <span class="th-label">Condition</span>
                  <button type="button" class="th-sort-indicator" aria-label="Sort by condition" title="Sort"></button>
                </th>
                <th class="th-sortable col-ratio" data-sort="qratio">
                  <span class="th-label">Log2 Ratio</span>
                  <button type="button" class="th-sort-indicator" aria-label="Sort by Log2 ratio" title="Sort"></button>
                </th>
                <th class="th-sortable col-pvalue" data-sort="pvalue">
                  <span class="th-label"><i>P</i> value</span>
                  <button type="button" class="th-sort-indicator" aria-label="Sort by P value" title="Sort"></button>
                </th>
                <th class="th-sortable col-score is-sorted" data-sort="qptmscore">
                  <span class="th-label">Reliability</span>
                  <button type="button" class="th-sort-indicator is-desc" aria-label="Sort by reliability" title="Sort"></button>
                </th>
              </tr>
            </thead>
            <tbody id="tableChange">
              <tr><td colspan="11"><div class="status-msg"><div class="typing-dots" aria-hidden="true"><span></span><span></span><span></span></div>Loading results...</div></td></tr>
            </tbody>
          </table>
        </div>

        <div class="result-footer">
          <span id="pageInfo" class="result-page-info">Loading...</span>
          <div id="pageButton"></div>
        </div>
      </div>
    </div>
  </section>

  <div id="site-footer"></div>

  <a href="#" class="back-to-top"><i class="ri-arrow-up-line"></i></a>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/echarts.min.js"></script>
  <script src="assets/js/ehcarts.structure.js"></script>
  <script src="assets/js/result.js"></script>
</body>
</html>
